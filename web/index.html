<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Your self-hosted artifact library."><title>Library — tshare</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><a class="wordmark" href="/">tshare<span>/ library</span></a><a href="https://github.com/identity16/tshare" rel="noreferrer">Source</a></header>
<main class="container"><div class="intro"><h1>Your work, within reach.</h1><p>Preview, read, and revisit the things you made.</p></div>
<div class="tools"><label class="search-label"><span>Search library</span><input id="search" type="search" placeholder="Find a title or description" autocomplete="off"></label><label class="sort-label"><span>Sort</span><select id="sort"><option value="recent">Recently added</option><option value="name">Name</option></select></label></div>
<div class="filterbar"><div id="filters" role="group" aria-label="Artifact type"></div><p id="count" aria-live="polite"></p></div>
<p id="status" role="status">Loading your library…</p><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><h2 id="empty-title">Your library starts here.</h2><p id="empty-message">Share a file from the host to see it here.</p><code>tshare ./preview.html preview</code></div>
<footer><span>On your host. On your terms.</span><button id="reload">Refresh library</button></footer></main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-bar"><button id="back">Back to library</button><div class="actions"><button id="copy">Copy link</button><a id="original" target="_blank" rel="noopener noreferrer">Open original</a><a id="download" download>Download</a><button id="remove" class="danger">Delete</button></div></div><div class="viewer-title"><h2 id="viewer-title"></h2><p id="viewer-description"></p></div><div id="viewer-body"></div><p id="viewer-status" role="status"></p></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
