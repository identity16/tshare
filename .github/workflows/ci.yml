name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
  team-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tshare_test
          POSTGRES_PASSWORD: test-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tshare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TSHARE_TEST_ADMIN_URL: postgres://postgres:test-only-admin@127.0.0.1:5432/tshare_test
      TSHARE_TEST_RUNTIME_URL: postgres://tshare_runtime:test-only-runtime@127.0.0.1:5432/tshare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Create isolated test runtime role
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const db = new pg.Client({connectionString: process.env.TSHARE_TEST_ADMIN_URL});
          await db.connect();
          try {
            await db.query("CREATE ROLE tshare_runtime LOGIN PASSWORD 'test-only-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS");
          } finally { await db.end(); }
          JS
      - run: npm run test:integration
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tshare:test .
      - name: Check headless and UI container modes
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tshare-test -e TSHARE_PASSWORD=test-only-password -p 8791:8791 tshare:test
          trap 'docker logs tshare-test; docker rm -f tshare-test' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8791/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8791/healthz | grep '"ui":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -u tshare:test-only-password http://127.0.0.1:8791/)" = 404
          docker exec tshare-test sh -c 'mkdir -p /tmp/input; echo container-snapshot > /tmp/input/note.txt'
          docker exec tshare-test node src/cli.js /tmp/input/note.txt note
          curl -fsS -u tshare:test-only-password http://127.0.0.1:8791/share/note/note.txt | grep container-snapshot
          docker rm -f tshare-test
          docker run -d --name tshare-test -e TSHARE_PASSWORD=test-only-password -p 8791:8791 tshare:test serve --host 0.0.0.0 --ui
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8791/healthz; then break; fi
            sleep 1
          done
          curl -fsS -u tshare:test-only-password http://127.0.0.1:8791/ | grep 'Your work, within reach'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/artifacts)" = 401
